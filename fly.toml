# Fly.io — https://fly.io/docs/
# İlk dəfə: flyctl quraşdırın, `fly auth login`, sonra `fly launch` (bu faylı təsdiqləyə bilərsiniz)
# və ya: fly apps create APP_ADI && fly deploy --app APP_ADI

app = "isci-idare-paneli"
primary_region = "ams"

[build]

# Docker image-da .env YOXDUR. Deploy əvvəl və ya sonra:
#   fly secrets set JWT_SECRET="$(openssl rand -hex 32)" JWT_REFRESH_SECRET="$(openssl rand -hex 32)" MONGODB_URI="mongodb+srv://..."
# və ya backend-də: npm run gen:jwt-secrets — dəyərləri kopyalayıb Fly-da təyin edin.
[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

# UI-da 256MB seçmisiniz; Node+Mongo istiqamətində 512MB daha təhlükəsizdir (OOM olarsa buranı artırın).
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
