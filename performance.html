<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performans - 555 İnşaat</title>
    <link rel="stylesheet" href="vendor/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar" aria-label="Əsas menyu"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1>Performans</h1>
                    <p>İşçi performans izləmə və reytinqi</p>
                </div>
                <div class="topbar-right">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" placeholder="Axtarış...">
                    </div>
                    <button class="btn-icon" id="themeToggle">
                        <i class="bi bi-moon"></i>
                    </button>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab-btn active" data-tab="daily">Günlük</button>
                    <button class="tab-btn" data-tab="weekly">Həftəlik</button>
                    <button class="tab-btn" data-tab="monthly">Aylıq</button>
                    <button class="tab-btn" data-tab="ranking">Reytinq</button>
                </div>

                <!-- Daily Performance -->
                <div id="daily" class="tab-content active">
                    <div class="filter-section">
                        <div class="filter-form">
                            <div class="form-group">
                                <label>Tarix</label>
                                <input type="date" id="dailyDate" class="form-control" value="">
                            </div>
                            <div class="form-group">
                                <label>İşçi</label>
                                <select id="dailyWorker" class="form-control">
                                    <option value="">Hamısı</option>
                                </select>
                            </div>
                            <button class="btn btn-primary" onclick="openModal('addPerformanceModal')">
                                <i class="bi bi-plus-lg"></i>
                                Performans əlavə et
                            </button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3><i class="bi bi-calendar-day"></i> Günlük Performans</h3>
                        </div>
                        <div class="card-body">
                            <div class="table-container">
                                <table class="data-table" id="dailyPerformanceTable">
                                    <thead>
                                        <tr>
                                            <th>İşçi</th>
                                            <th>Tarix</th>
                                            <th>Status</th>
                                            <th>Saat</th>
                                            <th>Effektivlik</th>
                                            <th>Qeyd</th>
                                        </tr>
                                    </thead>
                                    <tbody id="dailyPerformanceBody">
                                        <!-- Dynamic content -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Weekly Performance -->
                <div id="weekly" class="tab-content">
                    <div class="card">
                        <div class="card-header">
                            <h3><i class="bi bi-calendar-week"></i> Həftəlik Performans</h3>
                        </div>
                        <div class="card-body">
                            <div id="weeklyPerformance">
                                <div class="empty-state">
                                    <i class="bi bi-graph-up"></i>
                                    <p>Həftəlik performans məlumatı</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Monthly Performance -->
                <div id="monthly" class="tab-content">
                    <div class="card">
                        <div class="card-header">
                            <h3><i class="bi bi-calendar-month"></i> Aylıq Performans</h3>
                        </div>
                        <div class="card-body">
                            <div id="monthlyPerformance">
                                <div class="empty-state">
                                    <i class="bi bi-graph-up"></i>
                                    <p>Aylıq performans məlumatı</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Ranking -->
                <div id="ranking" class="tab-content">
                    <div class="card">
                        <div class="card-header">
                            <h3><i class="bi bi-trophy"></i> İşçi Reytinqi</h3>
                        </div>
                        <div class="card-body">
                            <div id="workerRanking">
                                <div class="empty-state">
                                    <i class="bi bi-trophy"></i>
                                    <p>Reytinq məlumatı yüklənir...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Performance Modal -->
    <div class="modal" id="addPerformanceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Performans Əlavə Et</h3>
                <button class="modal-close" onclick="closeModal('addPerformanceModal')">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="addPerformanceForm">
                    <div class="form-group">
                        <label>İşçi *</label>
                        <select name="workerId" class="form-control" required>
                            <option value="">İşçi seçin</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tarix *</label>
                            <input type="date" name="date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Status *</label>
                            <select name="status" class="form-control" required>
                                <option value="present">Gəldi</option>
                                <option value="late">Gecikdi</option>
                                <option value="absent">Gəlmədi</option>
                                <option value="excused">İznlə</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>İş saatı</label>
                            <input type="number" name="hoursWorked" class="form-control" min="0" max="24" step="0.5" value="8">
                        </div>
                        <div class="form-group">
                            <label>Effektivlik (%)</label>
                            <input type="number" name="efficiency" class="form-control" min="0" max="100" value="100">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Qeyd</label>
                        <textarea name="notes" class="form-control" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addPerformanceModal')">Ləğv et</button>
                <button class="btn btn-primary" onclick="addPerformance()">Əlavə et</button>
            </div>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="auth-backend.js"></script>
    <script src="data-layer.js"></script>
    <script src="auth.js"></script>
    <script src="admin-shell.js"></script>
    <script src="app.js"></script>
    <script>
        // Check authentication
        const currentUser = checkAuth();
        if (currentUser && currentUser.role !== 'admin') {
            window.location.href = 'worker-dashboard.html';
        }

        // Update user name
        if (currentUser) {
            document.getElementById('userName').textContent = currentUser.name;
        }

        // Set today's date
        document.getElementById('dailyDate').value = new Date().toISOString().split('T')[0];

        // Initialize tabs
        initTabs();

        // Load workers to select
        function loadWorkerSelects() {
            const workers = getWorkers();
            const selects = document.querySelectorAll('select[name="workerId"], #dailyWorker');
            
            selects.forEach(select => {
                const currentValue = select.value;
                select.innerHTML = '<option value="">İşçi seçin</option>' +
                    workers.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
                select.value = currentValue;
            });
        }

        // Load daily performance
        function loadDailyPerformance() {
            const performance = getPerformance();
            const workers = getWorkers();
            const tbody = document.getElementById('dailyPerformanceBody');
            
            const dateFilter = document.getElementById('dailyDate').value;
            const workerFilter = document.getElementById('dailyWorker').value;
            
            let filtered = performance;
            if (dateFilter) {
                filtered = filtered.filter(p => p.date === dateFilter);
            }
            if (workerFilter) {
                filtered = filtered.filter(p => p.workerId == workerFilter);
            }
            
            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <p>Məlumat yoxdur</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(p => {
                const worker = workers.find(w => w.id === p.workerId);
                return `
                    <tr>
                        <td>${worker?.name || 'Naməlum'}</td>
                        <td>${formatDate(p.date)}</td>
                        <td>
                            <span class="badge badge-${p.status === 'present' ? 'success' : p.status === 'late' ? 'warning' : p.status === 'excused' ? 'info' : 'danger'}">
                                ${p.status === 'present' ? 'Gəldi' : p.status === 'late' ? 'Gecikdi' : p.status === 'excused' ? 'İznlə' : 'Gəlmədi'}
                            </span>
                        </td>
                        <td>${p.hoursWorked || 8} saat</td>
                        <td>
                            <div class="progress" style="width: 100px; display: inline-block; margin-right: 10px;">
                                <div class="progress-bar" style="width: ${p.efficiency || 100}%"></div>
                            </div>
                            ${p.efficiency || 100}%
                        </td>
                        <td>${p.notes || '-'}</td>
                    </tr>
                `;
            }).join('');
        }

        // Load ranking
        function loadRanking() {
            const workers = getWorkers();
            const performance = getPerformance();
            
            const workerStats = workers.map(worker => {
                const workerPerf = performance.filter(p => p.workerId === worker.id);
                const avgEfficiency = workerPerf.length > 0 
                    ? workerPerf.reduce((sum, p) => sum + (p.efficiency || 0), 0) / workerPerf.length 
                    : 0;
                const presentDays = workerPerf.filter(p => p.status === 'present').length;
                const totalDays = workerPerf.length;
                const attendanceRate = totalDays > 0 ? (presentDays / totalDays * 100) : 0;
                
                return { 
                    ...worker, 
                    avgEfficiency, 
                    presentDays, 
                    totalDays,
                    attendanceRate,
                    score: (avgEfficiency * 0.6) + (attendanceRate * 0.4)
                };
            });

            workerStats.sort((a, b) => b.score - a.score);

            const container = document.getElementById('workerRanking');
            if (workerStats.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <p>Məlumat yoxdur</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Sıra</th>
                                <th>İşçi</th>
                                <th>Vəzifə</th>
                                <th>Effektivlik</th>
                                <th>Davamiyyət</th>
                                <th>Ümumi Bal</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${workerStats.map((worker, index) => `
                                <tr>
                                    <td>
                                        ${index < 3 ? `<i class="bi bi-trophy-fill" style="color: ${index === 0 ? '#FFD700' : index === 1 ? '#C0C0C0' : '#CD7F32'}"></i>` : index + 1}
                                    </td>
                                    <td><strong>${worker.name}</strong></td>
                                    <td>${worker.position}</td>
                                    <td>
                                        <div class="progress" style="width: 100px; display: inline-block; margin-right: 10px;">
                                            <div class="progress-bar" style="width: ${worker.avgEfficiency}%"></div>
                                        </div>
                                        ${worker.avgEfficiency.toFixed(1)}%
                                    </td>
                                    <td>${worker.attendanceRate.toFixed(1)}%</td>
                                    <td><strong>${worker.score.toFixed(1)}</strong></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Add performance
        function addPerformance() {
            const form = document.getElementById('addPerformanceForm');
            const formData = new FormData(form);
            
            const performance = getPerformance();
            const newPerformance = {
                id: generateId(),
                workerId: parseInt(formData.get('workerId')),
                date: formData.get('date'),
                status: formData.get('status'),
                hoursWorked: parseFloat(formData.get('hoursWorked')) || 8,
                efficiency: parseInt(formData.get('efficiency')) || 100,
                notes: formData.get('notes')
            };

            performance.push(newPerformance);
            saveData('performance', performance);
            
            closeModal('addPerformanceModal');
            form.reset();
            loadDailyPerformance();
            showAlert('Performans məlumatı əlavə edildi', 'success');
        }

        // Event listeners
        document.getElementById('dailyDate')?.addEventListener('change', loadDailyPerformance);
        document.getElementById('dailyWorker')?.addEventListener('change', loadDailyPerformance);

        // Load on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadWorkerSelects();
            loadDailyPerformance();
            loadRanking();
        });
    </script>
</body>
</html>
