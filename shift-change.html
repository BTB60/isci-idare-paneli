<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Növbə Dəyişmə - 555 İnşaat</title>
    <link rel="stylesheet" href="vendor/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar" id="sidebar" aria-label="Əsas menyu"></aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><h1>Növbə Dəyişmə</h1><p>İş günü dəyişmə sorğuları</p></div>
                <div class="topbar-right">
                    <div class="search-box"><i class="bi bi-search"></i><input type="text" placeholder="Axtarış..."></div>
                    <button class="btn-icon" id="themeToggle"><i class="bi bi-moon"></i></button>
                </div>
            </header>

            <div class="page-content">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="pending">Gözləyən</button>
                    <button class="tab-btn" data-tab="approved">Təsdiqlənmiş</button>
                    <button class="tab-btn" data-tab="rejected">Rədd edilmiş</button>
                </div>

                <div id="pending" class="tab-content active">
                    <div class="card">
                        <div class="card-header"><h3><i class="bi bi-hourglass-split"></i> Gözləyən Sorğular</h3></div>
                        <div class="card-body"><div id="pendingShifts"></div></div>
                    </div>
                </div>

                <div id="approved" class="tab-content">
                    <div class="card">
                        <div class="card-header"><h3><i class="bi bi-check-circle"></i> Təsdiqlənmiş</h3></div>
                        <div class="card-body"><div id="approvedShifts"></div></div>
                    </div>
                </div>

                <div id="rejected" class="tab-content">
                    <div class="card">
                        <div class="card-header"><h3><i class="bi bi-x-circle"></i> Rədd edilmiş</h3></div>
                        <div class="card-body"><div id="rejectedShifts"></div></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="config.js"></script>
    <script src="auth-backend.js"></script>
    <script src="data-layer.js"></script>
    <script src="auth.js"></script>
    <script src="admin-shell.js"></script>
    <script src="app.js"></script>
    <script>
        const currentUser = checkAuth();
        if (currentUser && currentUser.role !== 'admin') window.location.href = 'worker-dashboard.html';
        if (currentUser) document.getElementById('userName').textContent = currentUser.name;

        initTabs();

        function loadShiftChanges() {
            const shifts = getShiftChanges();
            const workers = getWorkers();

            ['pending', 'approved', 'rejected'].forEach(status => {
                const container = document.getElementById(status + 'Shifts');
                const filtered = shifts.filter(s => s.status === status);

                if (filtered.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="bi bi-inbox"></i><p>${status === 'pending' ? 'Gözləyən sorğu yoxdur' : status === 'approved' ? 'Təsdiqlənmiş sorğu yoxdur' : 'Rədd edilmiş sorğu yoxdur'}</p></div>`;
                    return;
                }

                container.innerHTML = `<div class="table-container"><table class="data-table"><thead><tr><th>Sorğu edən</th><th>Dəyişmə ilə</th><th>Tarix</th><th>Səbəb</th>${status === 'pending' ? '<th>Əməliyyatlar</th>' : ''}</tr></thead><tbody>${filtered.map(s => {
                    const requester = workers.find(w => w.id === s.requesterId);
                    const target = workers.find(w => w.id === s.targetId);
                    return `<tr>
                        <td><strong>${requester?.name || 'Naməlum'}</strong></td>
                        <td>${target?.name || 'Naməlum'}</td>
                        <td>${formatDate(s.date)}</td>
                        <td>${s.reason}</td>
                        ${status === 'pending' ? `<td><div class="action-btns"><button class="btn-action btn-success" onclick="approveShift(${s.id})" title="Təsdiqlə" style="background:rgba(40,167,69,0.1);color:var(--success)"><i class="bi bi-check-lg"></i></button><button class="btn-action btn-delete" onclick="rejectShift(${s.id})" title="Rədd et"><i class="bi bi-x-lg"></i></button></div></td>` : ''}
                    </tr>`;
                }).join('')}</tbody></table></div>`;
            });
        }

        function approveShift(id) {
            let shifts = getShiftChanges();
            const idx = shifts.findIndex(s => s.id === id);
            if (idx !== -1) {
                shifts[idx].status = 'approved';
                shifts[idx].approvedBy = currentUser.id;
                shifts[idx].approvedAt = new Date().toISOString();
                saveData('shiftChanges', shifts);
                loadShiftChanges();
                showAlert('Sorğu təsdiqləndi', 'success');
            }
        }

        function rejectShift(id) {
            let shifts = getShiftChanges();
            const idx = shifts.findIndex(s => s.id === id);
            if (idx !== -1) {
                shifts[idx].status = 'rejected';
                shifts[idx].rejectedBy = currentUser.id;
                shifts[idx].rejectedAt = new Date().toISOString();
                saveData('shiftChanges', shifts);
                loadShiftChanges();
                showAlert('Sorğu rədd edildi', 'danger');
            }
        }

        document.addEventListener('DOMContentLoaded', loadShiftChanges);
    </script>
</body>
</html>
